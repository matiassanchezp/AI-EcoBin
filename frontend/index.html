<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-EcoBin</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f3f6f4; color: #1d2b22; }
  header { background: #2e7d32; color: #fff; padding: 16px 20px; }
  main { max-width: 800px; margin: 0 auto; padding: 16px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { flex: 1; min-width: 140px; background: #fff; border-radius: 10px; padding: 16px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card b { display: block; font-size: 2rem; }
  table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 16px; border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e5e5e5; font-size: .9rem; }
  th { background: #e8f0ea; }
  button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 8px; background: #c62828; color: #fff; cursor: pointer; }
  #estado { font-size: .85rem; margin-top: 8px; }
</style>
</head>
<body>
<header><h1>AI-EcoBin</h1></header>
<main>
  <div class="cards">
    <div class="card">Orgánico<b id="n-org">0</b></div>
    <div class="card">Inorgánico<b id="n-inorg">0</b></div>
    <div class="card">Total<b id="n-total">0</b></div>
  </div>

  <button id="btn-reset">Vaciar caneca</button>
  <div id="estado"></div>

  <table>
    <thead><tr><th>Fecha y hora</th><th>Categoría</th><th>Clase</th><th>Confianza</th></tr></thead>
    <tbody id="tabla"></tbody>
  </table>
</main>

<script>
// URL pública del backend (se completa en el paso 3). Sin "/" al final.
const BACKEND_URL = "https://ai-ecobin.onrender.com";

const $ = id => document.getElementById(id);

async function cargar() {
  if (!BACKEND_URL) {
    $("estado").textContent = "Backend aún no configurado.";
    return;
  }
  try {
    const r = await fetch(BACKEND_URL + "/history");
    const datos = await r.json();

    $("n-org").textContent = datos.filter(d => d.categoria === "organico").length;
    $("n-inorg").textContent = datos.filter(d => d.categoria === "inorganico").length;
    $("n-total").textContent = datos.length;

    $("tabla").innerHTML = datos.map(d => `
      <tr>
        <td>${new Date(d.timestamp).toLocaleString("es-CO", { hour12: false })}</td>
        <td>${d.categoria}</td>
        <td>${d.clase_original}</td>
        <td>${d.confianza}</td>
      </tr>`).join("");
    $("estado").textContent = "Conectado ✔";
  } catch (e) {
    $("estado").textContent = "No se pudo conectar con el backend.";
  }
}

$("btn-reset").addEventListener("click", async () => {
  if (!BACKEND_URL || !confirm("¿Vaciar la caneca?")) return;
  await fetch(BACKEND_URL + "/reset", { method: "POST" });
  cargar();
});

cargar();
setInterval(cargar, 5000);
</script>
</body>
</html>
